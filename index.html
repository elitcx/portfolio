    <meta name="theme-color" content="#0C0B0B" />
    <!-- Resolve the theme before first paint; React's effect runs too late and
         a saved light theme would otherwise flash the dark token set. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              (window.matchMedia
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                : true));
          document.documentElement.setAttribute('data-pt', dark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* tokens default to dark */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600;700;800;900&display=swap" />
