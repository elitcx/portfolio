    <!-- Resolve the theme before first paint; React's effect runs too late and
         a saved light theme would otherwise flash the dark token set. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              (window.matchMedia
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                : true));
          document.documentElement.setAttribute('data-pt', dark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* tokens default to dark */ }
      })();
    </script>
