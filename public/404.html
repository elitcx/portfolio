<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Kenneth Jehezkiel Marvel Wijaya</title>
    <!-- A real 404 rather than the SPA shell: serving the home page under a
         wrong URL would make Google index a soft-404 and dilute the site. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0c0b0b; color: #f5f4f2; text-align: center; padding: 2rem;
        font-family: Barlow, system-ui, -apple-system, sans-serif;
      }
      .code { font-size: clamp(4rem, 18vw, 8rem); font-weight: 900; letter-spacing: -.04em; line-height: 1; color: #e0413a; }
      h1 { font-size: 1.5rem; font-weight: 800; margin: 1rem 0 .5rem; letter-spacing: -.01em; }
      p { color: #8a8580; margin: 0 0 2rem; }
      a {
        display: inline-block; padding: .7rem 1.5rem; border-radius: 999px;
        background: #e0413a; color: #fff; text-decoration: none;
        font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>This page doesn't exist</h1>
      <p>The link may be out of date, or the address mistyped.</p>
      <a href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
